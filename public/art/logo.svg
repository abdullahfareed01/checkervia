<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 190">
  <!-- The Checkervia logo (D51): a cream piece behind a gold rimmed king,
       with three gold sparkles. The pieces are the same drawings as
       piece-white.svg and piece-king.svg (an SVG shown as an image cannot
       load other files, so they are copied here). -->
  <defs>
    <linearGradient id="w-side" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a88a5e"/>
      <stop offset="0.35" stop-color="#e6d3ad"/>
      <stop offset="0.7" stop-color="#cdb184"/>
      <stop offset="1" stop-color="#9c7d52"/>
    </linearGradient>
    <radialGradient id="w-top" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f0e0bf"/>
      <stop offset="1" stop-color="#d6bf93"/>
    </radialGradient>
    <linearGradient id="k-side" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a0f08"/>
      <stop offset="0.4" stop-color="#4a2e1a"/>
      <stop offset="0.7" stop-color="#2c1a0e"/>
      <stop offset="1" stop-color="#150c06"/>
    </linearGradient>
    <linearGradient id="k-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#d99a2b"/>
      <stop offset="1" stop-color="#8a5a14"/>
    </linearGradient>
    <radialGradient id="k-top" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5b3a24"/>
      <stop offset="1" stop-color="#2a180c"/>
    </radialGradient>
    <radialGradient id="k-face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3f2817"/>
      <stop offset="1" stop-color="#24150b"/>
    </radialGradient>
    <linearGradient id="k-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e09a24"/>
    </linearGradient>
  </defs>

  <!-- Cream piece, lower left. -->
  <g transform="translate(4 88)">
    <path d="M6 40V60A54 28 0 0 0 114 60V40Z" fill="url(#w-side)"/>
    <ellipse cx="60" cy="40" rx="54" ry="28" fill="url(#w-top)"/>
    <ellipse cx="60" cy="40" rx="40" ry="20" fill="none" stroke="#c9ad7f" stroke-width="3"/>
    <ellipse cx="60" cy="41.5" rx="40" ry="20" fill="none" stroke="#fff7e6" stroke-width="1.2" opacity="0.6"/>
    <path d="M20 31c9-9 24-13 38-13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- King, upper right, a little tilted, with a soft shadow on the cream piece. -->
  <ellipse cx="128" cy="126" rx="40" ry="11" fill="#2a1608" opacity="0.35"/>
  <g transform="translate(76 36) rotate(-8 60 56)">
    <path d="M6 50V64A54 46 0 0 0 114 64V50Z" fill="url(#k-side)"/>
    <path d="M6 64A54 46 0 0 0 114 64" fill="none" stroke="#c98a26" stroke-width="2" opacity="0.7"/>
    <ellipse cx="60" cy="50" rx="54" ry="46" fill="url(#k-top)"/>
    <ellipse cx="60" cy="50" rx="51" ry="43" fill="none" stroke="url(#k-rim)" stroke-width="4"/>
    <ellipse cx="60" cy="50" rx="40" ry="34" fill="url(#k-face)" stroke="#170d06" stroke-width="2"/>
    <ellipse cx="60" cy="50" rx="35" ry="29.5" fill="none" stroke="#5a3a22" stroke-width="1.2"/>
    <g transform="translate(60 52) scale(1.85 1.6) translate(-12 -13)" fill="url(#k-crown)">
      <path d="M3 18l1.5-10 5 4.5L12 5l2.5 7.5 5-4.5L21 18z"/>
      <rect x="3" y="19" width="18" height="2.4" rx="1"/>
    </g>
    <path d="M18 30c10-14 28-22 46-22" fill="none" stroke="#fff3d0" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Three gold sparkles above the king. -->
  <g stroke="#f2b938" stroke-width="5" stroke-linecap="round">
    <path d="M160 24l-6-12"/>
    <path d="M174 20l3-15"/>
    <path d="M187 29l12-9"/>
  </g>
</svg>
