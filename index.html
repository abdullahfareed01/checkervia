<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2018" />
    <title>Checkervia</title>
    <meta name="application-name" content="Checkervia" />
    <meta name="description" content="Checkervia: checkers for two players on one screen, or against an AI with a personality." />
    <meta property="og:title" content="Checkervia" />
    <meta property="og:description" content="Play checkers with a friend on one screen, or against an AI with a personality." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/fraunces-black-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/art/logo.svg" as="image" type="image/svg+xml" />
    <!-- Splash styles live here, not in the CSS bundle, so the splash shows
         while the JavaScript is still downloading. Used by src/ui/Splash.tsx too,
         and the board scenery and the title font by the result panel. -->
    <style>
      /* The title font (D51): Fraunces Black, latin only, served from this
         site (public/fonts, SIL Open Font License). Georgia until it loads. */
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url("/fonts/fraunces-black-latin.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: #2b2018;
      }
      /* ---------- Splash (D51, after mockup/splash_screen_mockup.png) ---------- */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 22vh;
        background: radial-gradient(120% 70% at 50% 36%, #4c2d1a 0%, #2a170d 55%, #160b05 100%);
        color: #f5e9d8;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease-out;
      }
      .splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      /* A thin gold frame, visible at the corners and fading along the sides. */
      .splash-frame {
        position: absolute;
        inset: 6px;
        z-index: 2;
        border: 2px solid #d9a441;
        border-radius: 34px;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 9%, transparent 26%, transparent 74%, #000 91%, #000 100%);
        mask-image: linear-gradient(to bottom, #000 0, #000 9%, transparent 26%, transparent 74%, #000 91%, #000 100%);
      }
      .splash-main {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(420px, 100%);
      }
      /* The logo, with a warm light behind it (D51 allows it here). */
      .splash-logo {
        position: relative;
        width: clamp(140px, min(46vw, 26vh), 230px);
        margin-bottom: 6px;
      }
      .splash-logo::before {
        content: "";
        position: absolute;
        inset: -30% -25%;
        z-index: -1;
        background: radial-gradient(closest-side, rgba(232, 150, 52, 0.38), rgba(232, 150, 52, 0));
      }
      .splash-logo .logo {
        display: block;
        width: 100%;
        height: auto;
      }
      .splash-title {
        margin: 0;
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-size: clamp(2.6rem, min(15vw, 10vh), 5rem);
        line-height: 1.05;
        letter-spacing: 0.01em;
        color: #f8ead0;
        text-shadow:
          0 2px 0 rgba(120, 74, 30, 0.55),
          0 8px 22px rgba(0, 0, 0, 0.45);
      }
      .splash-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(78%, 320px);
        margin: 8px 0 6px;
        color: #e6ac3a;
      }
      .splash-divider span {
        flex: 1;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(230, 172, 58, 0), #e6ac3a);
      }
      .splash-divider span:last-child {
        background: linear-gradient(90deg, #e6ac3a, rgba(230, 172, 58, 0));
      }
      .splash-crown {
        width: 28px;
        height: 28px;
        fill: currentColor;
      }
      .splash-sub {
        margin: 0 -0.55em 0 0;
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.55em;
        text-transform: uppercase;
        color: #f1e1c4;
      }
      /* The progress bar: each step is real work, there is no timer. */
      .splash-bar {
        width: min(74%, 300px);
        height: 18px;
        margin-top: clamp(20px, 6vh, 56px);
        padding: 3px;
        box-sizing: border-box;
        border-radius: 999px;
        border: 1.5px solid rgba(217, 164, 65, 0.55);
        background: #24140a;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .splash-bar-fill {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffdc78 0%, #f0b232 55%, #d89524 100%);
        transition: width 0.5s ease-out;
      }
      .splash-note {
        margin: 12px 0 0;
        font-size: 1.05rem;
        color: #f1e1c4;
      }
      /* ---------- Board scenery (splash and the result panel) ----------
         A checkerboard in perspective along the bottom, fading upwards, with a
         blurred cream piece and king at the corners. Decoration only. */
      .scenery {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34%;
        overflow: hidden;
        pointer-events: none;
      }
      .scenery-board {
        position: absolute;
        left: -40%;
        right: -40%;
        bottom: 0;
        height: 180%;
        background:
          radial-gradient(60% 50% at 50% 70%, rgba(214, 120, 52, 0.28), rgba(214, 120, 52, 0)),
          repeating-conic-gradient(#74401f 0 25%, #341b0c 0 50%) 50% 100% / min(46vw, 240px) min(40vw, 210px);
        transform: perspective(420px) rotateX(58deg);
        transform-origin: 50% 100%;
        -webkit-mask-image: linear-gradient(to top, #000 35%, transparent 80%);
        mask-image: linear-gradient(to top, #000 35%, transparent 80%);
      }
      .scenery-piece {
        position: absolute;
        height: auto;
        filter: blur(1.5px) brightness(0.9);
      }
      .scenery-piece-white {
        left: -9%;
        bottom: -10%;
        width: min(34%, 200px, 38vh);
      }
      .scenery-piece-king {
        right: -12%;
        bottom: -14%;
        width: min(40%, 230px, 44vh);
        transform: rotate(-14deg);
      }
      /* Short screens (and phones held sideways): smaller art, so the bar and
         its line stay on screen. */
      @media (max-height: 640px) {
        .splash {
          padding-bottom: 16vh;
        }
        .scenery {
          height: 22%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash-bar-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React starts; React then renders the same splash
           (src/ui/Splash.tsx) one step further along. -->
      <div class="splash" role="status" aria-live="polite">
        <div class="splash-frame" aria-hidden="true"></div>
        <div class="scenery" aria-hidden="true">
          <div class="scenery-board"></div>
          <img class="scenery-piece scenery-piece-white" src="/art/piece-white.svg" alt="" />
          <img class="scenery-piece scenery-piece-king" src="/art/piece-king.svg" alt="" />
        </div>
        <div class="splash-main">
          <div class="splash-logo"><img class="logo" src="/art/logo.svg" alt="" /></div>
          <h1 class="splash-title">Checkervia</h1>
          <div class="splash-divider" aria-hidden="true">
            <span></span><svg class="splash-crown" viewBox="0 0 24 24"><path d="M3 18l1.5-10 5 4.5L12 5l2.5 7.5 5-4.5L21 18z" /><rect x="3" y="19" width="18" height="2.4" rx="1" /></svg><span></span>
          </div>
          <p class="splash-sub">Checkers</p>
          <div class="splash-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" aria-valuetext="Loading the game">
            <span class="splash-bar-fill" style="width: 30%"></span>
          </div>
          <p class="splash-note">Loading the game…</p>
        </div>
      </div>
    </div>
    <noscript>Checkervia needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
