<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2018" />
    <title>Draft</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Splash styles live here, not in the CSS bundle, so the splash shows
         while the JavaScript is still downloading. Used by src/ui/Splash.tsx too. -->
    <style>
      html,
      body {
        margin: 0;
        background: #2b2018;
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #2b2018;
        color: #f5e9d8;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease-out;
      }
      .splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 112px;
        height: 112px;

      }
      .splash-logo .logo {
        width: 100%;
        height: 100%;
      }
      .splash-title {
        margin: 0;
        font-size: 2.6rem;
        letter-spacing: 0.08em;
        color: #f5e9d8;
      }
      .splash-steps {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
        font-size: 0.95rem;
        color: #e9d8bd;
      }
      .splash-step {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* A spinner while a step runs, a tick once it is done. */
      .splash-step::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #d9ab3a;
        animation: splash-spin 0.8s linear infinite;
      }
      .splash-step-done::before {
        content: "\2713";
        border: none;
        width: 16px;
        height: 16px;
        font-size: 0.85rem;
        line-height: 16px;
        text-align: center;
        color: #8fd19e;
        animation: none;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash-step::before {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React starts; React then renders the same splash. -->
      <div class="splash" role="status" aria-live="polite">
        <div class="splash-logo">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="24" cy="38" r="17" fill="#e9e2d6" stroke="#5bc8ff" stroke-width="2.5" />
            <circle cx="24" cy="38" r="11" fill="none" stroke="#b9b0a2" stroke-width="1.5" />
            <circle cx="40" cy="27" r="17" fill="#2a211b" stroke="#ffcf40" stroke-width="2.5" />
            <circle cx="40" cy="27" r="11" fill="none" stroke="#4a3b30" stroke-width="1.5" />
            <path d="M32 31l2-8 4 4 2-6 2 6 4-4 2 8z" fill="#ffcf40" />
          </svg>
        </div>
        <h1 class="splash-title">Draft</h1>
        <ul class="splash-steps">
          <li class="splash-step">Loading the game…</li>
        </ul>
      </div>
    </div>
    <noscript>Draft needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
